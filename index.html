<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --red: #ff0000;
  --bg: #000;
  --card: #111;
  --border: #222;
  --muted: #888;
  --text: #fff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.container { max-width: 1300px; margin: 0 auto; padding: 15px; width: 100%; flex: 1; }

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  gap: 15px;
}
.logo { font-size: 24px; font-weight: 900; font-style: italic; }
.logo .r { color: var(--red); }
.logo .w { color: #fff; }
.user { font-size: 12px; color: var(--muted); padding: 5px 12px; background: var(--card); border-radius: 20px; }

/* Jogos Ao Vivo */
.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.section-header::before {
  content: '';
  display: block;
  width: 4px;
  height: 20px;
  background: var(--red);
  border-radius: 2px;
}
.section-header h2 { font-size: 20px; color: #fff; }
.section-header span { color: var(--muted); font-size: 15px; }

/* Carrossel e Setas */
.games-wrapper {
  position: relative;
  margin-bottom: 25px;
}
.games-carousel {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding-bottom: 10px;
  scrollbar-width: none; /* Firefox */
  scroll-behavior: smooth;
}
.games-carousel::-webkit-scrollbar { display: none; /* Chrome/Safari */ }

.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(17, 17, 17, 0.9);
  border: 1px solid var(--border);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: all 0.2s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.8);
}
.nav-arrow:hover { background: var(--red); border-color: var(--red); }
.nav-arrow.left { left: -15px; }
.nav-arrow.right { right: -15px; }

.game-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  min-width: 300px;
  flex-shrink: 0;
  overflow: hidden;
  transition: transform 0.2s;
  display: flex;
  flex-direction: column;
}
.game-card:hover { transform: translateY(-3px); border-color: #444; }

.game-info {
  padding: 12px 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #ddd;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  justify-content: space-between;
  background: #161616;
}
.game-info i { color: var(--muted); }
.game-info .live-tag { color: var(--red); font-weight: bold; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

.game-teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 15px;
}
.team { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
.team img { width: 50px; height: 50px; object-fit: contain; }
.team span { font-size: 14px; font-weight: 600; text-align: center; line-height: 1.3; }
.game-vs { color: #fff; font-size: 15px; font-weight: bold; padding: 0 10px; text-align: center;}

.game-channel-info {
  text-align: center;
  font-size: 13px;
  color: #ffdfa6;
  background: #241c14;
  padding: 8px 10px;
  border-radius: 6px;
  margin: 0 15px 15px 15px;
  line-height: 1.4;
  word-break: break-word;
}
.game-channel-info b { color: #fff; }

.game-btn {
  background: var(--red);
  color: #fff;
  border: none;
  padding: 14px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.2s;
  margin-top: auto;
}
.game-btn:hover { background: #cc0000; }

/* Player */
.player-wrap {
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 25px;
  border: 1px solid var(--border);
  scroll-margin-top: 20px;
}
.player-head {
  background: var(--card);
  padding: 12px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.current-name { color: #fff; font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.live-badge { background: var(--red); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
.refresh-btn {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.refresh-btn:hover { background: #222; color: #fff; }

.player-container { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
.player-container iframe { width: 100% !important; height: 100% !important; border: 0; display: block; }
.player-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #333; font-size: 15px; flex-direction: column; gap: 10px; }

/* Canais */
.channels-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.channels-head h2 { font-size: 20px; }
.channels-head h2 span { color: var(--red); }
.channels-head .count { color: var(--muted); font-size: 14px; }

.search-input {
  width: 100%;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #fff;
  font-size: 15px;
  margin-bottom: 20px;
}
.search-input:focus { outline: none; border-color: var(--red); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 15px; margin-bottom: 40px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
}
.card:hover { border-color: var(--red); transform: translateY(-2px); }
.card.active { border: 2px solid var(--red); }
.card-img { aspect-ratio: 1/1; background: #1a1a1a; display: flex; align-items: center; justify-content: center; position: relative; }
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.card-img i { font-size: 36px; color: #333; }
.lock-badge { position: absolute; top: 8px; right: 8px; background: #FFC107; color: #000; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.card-info { padding: 12px; text-align: center; }
.card-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-cat { color: var(--muted); font-size: 12px; }

.empty { grid-column: 1/-1; text-align: center; padding: 40px; color: var(--muted); background: var(--card); border-radius: 8px; }
.loading { grid-column: 1/-1; text-align: center; padding: 20px; color: var(--muted); }

/* Modal Parental */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.95); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 15px; }
.modal.show { display: flex; }
.modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 25px; width: 100%; max-width: 350px; text-align: center; }
.modal-box h3 { color: #fff; margin-bottom: 10px; font-size: 20px; }
.modal-box p { color: var(--muted); font-size: 14px; margin-bottom: 15px; }
.modal-box input { width: 100%; padding: 12px; background: #222; border: 1px solid var(--border); color: #fff; border-radius: 4px; margin-bottom: 15px; font-size: 16px; text-align: center; }
.modal-box input:focus { outline: none; border-color: var(--red); }
.modal-box button { width: 100%; padding: 12px; border: 0; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 15px; margin-bottom: 8px; }
.modal-box .primary { background: var(--red); color: #fff; }
.modal-box .cancel { background: #333; color: #fff; }
.error { color: #ff4444; font-size: 13px; margin-top: 8px; display: none; }

.footer { background: var(--card); border-top: 1px solid var(--border); padding: 20px; text-align: center; color: #666; font-size: 13px; margin-top: auto; }

@media(max-width: 600px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 10px; }
  .game-card { min-width: 260px; }
  .nav-arrow { display: none; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo"><span class="r">D</span><span class="w">ark</span> <span class="r">P</span><span class="w">lay</span></div>
    <div class="user"><i class="fas fa-user"></i> <span id="userName">Visitante</span></div>
  </header>

  <!-- Jogos Ao Vivo -->
  <div id="gamesSection" style="display:none;">
    <div class="section-header">
      <h2>Jogos de Hoje</h2> <span id="gamesCount">(0)</span>
    </div>
    
    <div class="games-wrapper">
      <button class="nav-arrow left" onclick="scrollGames(-1)"><i class="fas fa-chevron-left"></i></button>
      <div class="games-carousel" id="gamesCarousel"></div>
      <button class="nav-arrow right" onclick="scrollGames(1)"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>

  <input type="text" class="search-input" id="search" placeholder="🔍 Buscar canal..." oninput="renderGrid()">

  <!-- Player -->
  <div class="player-wrap" id="playerWrap">
    <div class="player-head">
      <div class="current-name">
        <span class="live-badge"><i class="fas fa-circle"></i> AO VIVO</span>
        <span id="currentName">Selecione um canal</span>
      </div>
      <button class="refresh-btn" onclick="reloadPlayer()">
        <i class="fas fa-sync-alt"></i> Atualizar
      </button>
    </div>
    <div class="player-container" id="player">
      <div class="player-empty">
        <i class="fas fa-tv fa-3x"></i>
        <span>Selecione um canal abaixo</span>
      </div>
    </div>
  </div>

  <!-- Canais -->
  <div class="channels-head">
    <h2>Canais <span>Disponíveis</span></h2>
    <div class="count" id="count">0 canais</div>
  </div>

  <div class="grid" id="grid">
    <div class="loading"><i class="fas fa-circle-notch fa-spin"></i> Carregando canais...</div>
  </div>
</div>

<footer class="footer"><i class="fas fa-tv" style="color:var(--red)"></i> Dark Play © 2026</footer>

<div class="modal" id="parentalModal">
  <div class="modal-box">
    <h3>🔞 Conteúdo Restrito</h3>
    <p>Este canal requer senha para acesso</p>
    <input type="password" id="parentalPassword" placeholder="Digite a senha" onkeypress="if(event.key==='Enter')checkParental()">
    <button class="primary" onclick="checkParental()">LIBERAR ACESSO</button>
    <button class="cancel" onclick="closeParental()">CANCELAR</button>
    <div class="error" id="parentalError">Senha incorreta!</div>
  </div>
</div>

<script>
const UNLOCK_KEY = 'darkplay_unlocked';
let channels = [];
let jogosAoVivo = [];
let currentIndex = -1;
let pendingChannel = null;

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeUrl(u) {
  const s = String(u || '').trim();
  return /^(https?:|data:image\/)/i.test(s) ? s : '';
}
function getUnlocked() { try { return JSON.parse(localStorage.getItem(UNLOCK_KEY) || '[]'); } catch { return []; } }
function saveUnlocked(a) { localStorage.setItem(UNLOCK_KEY, JSON.stringify(a)); }
function isUnlocked(id) { return getUnlocked().includes(id); }

let uid = localStorage.getItem('darkplay_user');
if (!uid) { uid = 'user_' + Math.random().toString(36).slice(2, 8); localStorage.setItem('darkplay_user', uid); }
document.getElementById('userName').textContent = uid;

// Normaliza nome para matching
function normalizeName(name) {
  return String(name || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') 
    .replace(/\b(hd|fhd|uhd|4k|sd|h265|hevc)\b/g, '') 
    .replace(/[^a-z0-9 ]/g, '') 
    .replace(/\s+/g, ' ')
    .trim();
}

function findCanalByName(apiName) {
  const norm = normalizeName(apiName);
  if (!norm) return null;

  let found = channels.find(c => normalizeName(c.nome) === norm);
  if (found) return found;

  found = channels.find(c => {
    const cn = normalizeName(c.nome);
    return cn.includes(norm) || norm.includes(cn);
  });
  if (found) return found;

  let best = null, bestScore = 0;
  for (const c of channels) {
    const cn = normalizeName(c.nome);
    const score = similarity(norm, cn);
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return bestScore > 0.5 ? best : null; 
}

function similarity(a, b) {
  const setA = new Set(a.split(' '));
  const setB = new Set(b.split(' '));
  const inter = new Set([...setA].filter(x => setB.has(x)));
  const union = new Set([...setA, ...setB]);
  return inter.size / union.size;
}

async function loadChannels() {
  try {
    const res = await fetch('/api/canais', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    
    channels = Array.isArray(data.canais) ? data.canais : [];

    // ORDENAÇÃO ALFABÉTICA (A-Z)
    channels.sort((a, b) => {
      const nomeA = String(a.nome || '').toLowerCase();
      const nomeB = String(b.nome || '').toLowerCase();
      return nomeA.localeCompare(nomeB, 'pt-BR');
    });

    renderGrid();
    if (channels.length > 0 && currentIndex === -1) {
      setTimeout(() => playChannel(0, false), 500);
    }
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>Erro: ' + escapeHtml(e.message) + '</p></div>';
  }
}

async function loadJogosAoVivo() {
  try {
    const res = await fetch('/api/jogos-ao-vivo', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let todosJogos = Array.isArray(data.jogos) ? data.jogos : [];

    let jogosValidos = [];
    
    for (const jogo of todosJogos) {
      let canalEncontrado = null;
      let nomeCanalEncontrado = '';
      
      const canaisBrutos = jogo.canais || [];
      const canaisSeparados = [];
      
      for (const c of canaisBrutos) {
         const partes = c.split(/[·|,]/);
         for (const p of partes) {
            if (p.trim()) canaisSeparados.push(p.trim());
         }
      }

      for (const nomeCanal of canaisSeparados) {
        canalEncontrado = findCanalByName(nomeCanal);
        if (canalEncontrado) {
          nomeCanalEncontrado = nomeCanal;
          break; 
        }
      }

      if (canalEncontrado) {
        jogo.canalVinculado = canalEncontrado;
        jogo.canalIndex = channels.indexOf(canalEncontrado);
        jogo.canalNomeExibicao = nomeCanalEncontrado;
        jogosValidos.push(jogo);
      }
    }

    jogosAoVivo = jogosValidos;
    renderGames();
  } catch (e) {
    console.warn('Jogos ao vivo indisponíveis:', e.message);
    document.getElementById('gamesSection').style.display = 'none';
  }
}

function renderGames() {
  const section = document.getElementById('gamesSection');
  const carousel = document.getElementById('gamesCarousel');

  if (!jogosAoVivo.length) { section.style.display = 'none'; return; }

  document.getElementById('gamesCount').textContent = `(${jogosAoVivo.length})`;

  carousel.innerHTML = jogosAoVivo.map(jogo => {
    const infoStatus = jogo.status === 'ao_vivo' 
      ? `<span class="live-tag"><i class="fas fa-circle"></i> AO VIVO ${jogo.minuto ? '- ' + escapeHtml(jogo.minuto) : ''}</span>` 
      : `<span><i class="fas fa-clock"></i> ${escapeHtml(jogo.hora)}</span>`;

    return `
      <div class="game-card">
        <div class="game-info">
          <div>${infoStatus}</div>
          <div style="text-align:right"><i class="fas fa-trophy"></i> ${escapeHtml(jogo.liga)}</div>
        </div>
        <div class="game-teams">
          <div class="team">
            ${jogo.logoCasa ? `<img src="${escapeHtml(jogo.logoCasa)}" alt="" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt" style="font-size:30px;color:#333"></i>'}
            <span>${escapeHtml(jogo.timeCasa)}</span>
          </div>
          <div class="game-vs">
            ${jogo.placarCasa !== null && jogo.placarCasa !== undefined && jogo.placarFora !== null && jogo.placarFora !== undefined ? `${jogo.placarCasa} - ${jogo.placarFora}` : 'VS'}
          </div>
          <div class="team">
            ${jogo.logoFora ? `<img src="${escapeHtml(jogo.logoFora)}" alt="" onerror="this.style.display='none'">` : '<i class="fas fa-shield-alt" style="font-size:30px;color:#333"></i>'}
            <span>${escapeHtml(jogo.timeFora)}</span>
          </div>
        </div>
        <div class="game-channel-info">
          <i class="fas fa-tv"></i> Passando no canal: <b>${escapeHtml(jogo.canalVinculado.nome)}</b>
        </div>
        <button class="game-btn" onclick="selectChannel(${jogo.canalIndex})">
          <i class="fas fa-play"></i> ASSISTIR
        </button>
      </div>
    `;
  }).join('');

  section.style.display = 'block';
}

function scrollGames(direction) {
  const carousel = document.getElementById('gamesCarousel');
  const scrollAmount = 315;
  carousel.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const search = document.getElementById('search').value.toLowerCase().trim();

  const visible = channels.map((c, i) => ({ c, i })).filter(({ c }) => {
    if (!search) return true;
    return (c.nome || '').toLowerCase().includes(search) || (c.categoria || '').toLowerCase().includes(search);
  });

  document.getElementById('count').textContent = visible.length + ' canais';

  if (!visible.length) {
    grid.innerHTML = '<div class="empty"><i class="fas fa-tv"></i><p>Nenhum canal encontrado</p></div>';
    return;
  }

  grid.innerHTML = visible.map(({ c, i }) => {
    const locked = c.parental === true && !isUnlocked(c.id);
    const img = safeUrl(c.imagem);
    return `
      <div class="card ${i === currentIndex ? 'active' : ''}" data-idx="${i}" onclick="selectChannel(${i})">
        <div class="card-img">
          ${img ? `<img src="${escapeHtml(img)}" alt="" onerror="this.style.display='none'">` : '<i class="fas fa-tv"></i>'}
          ${locked ? '<div class="lock-badge"><i class="fas fa-lock"></i></div>' : ''}
        </div>
        <div class="card-info">
          <div class="card-name">${escapeHtml(c.nome || 'Sem nome')}</div>
          <div class="card-cat">${escapeHtml(c.categoria || 'Geral')}</div>
        </div>
      </div>
    `;
  }).join('');
}

function selectChannel(idx) {
  if (idx < 0 || idx >= channels.length) return;
  const ch = channels[idx];
  if (ch.parental === true && !isUnlocked(ch.id)) {
    pendingChannel = idx;
    document.getElementById('parentalPassword').value = '';
    document.getElementById('parentalError').style.display = 'none';
    document.getElementById('parentalModal').classList.add('show');
    setTimeout(() => document.getElementById('parentalPassword').focus(), 50);
    return;
  }
  playChannel(idx, true);
}

function playChannel(idx, scroll = true) {
  const ch = channels[idx];
  if (!ch) return;
  currentIndex = idx;
  document.getElementById('currentName').textContent = ch.nome || 'Canal';
  document.getElementById('player').innerHTML = ch.iframe || '<div class="player-empty">Canal sem embed configurado</div>';
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const active = document.querySelector(`.card[data-idx="${idx}"]`);
  if (active) active.classList.add('active');
  if (scroll) document.getElementById('playerWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function reloadPlayer() {
  if (currentIndex !== -1) playChannel(currentIndex, false);
}

function checkParental() {
  if (pendingChannel === null) return;
  const ch = channels[pendingChannel];
  const pwd = document.getElementById('parentalPassword').value;
  if (pwd === (ch.parental_senha || '')) {
    const u = getUnlocked();
    if (!u.includes(ch.id)) u.push(ch.id);
    saveUnlocked(u);
    const idx = pendingChannel;
    closeParental();
    playChannel(idx, true);
  } else {
    document.getElementById('parentalError').style.display = 'block';
    document.getElementById('parentalPassword').value = '';
    document.getElementById('parentalPassword').focus();
  }
}

function closeParental() {
  document.getElementById('parentalModal').classList.remove('show');
  pendingChannel = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeParental(); });
document.getElementById('parentalModal').addEventListener('click', e => {
  if (e.target.id === 'parentalModal') closeParental();
});

// Inicializar
loadChannels().then(() => loadJogosAoVivo());
</script>
</body>
</html>
