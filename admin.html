<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Dark Play</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--red:#ff0000;--bg:#000;--card:#111;--border:#222;--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;padding:15px;background:var(--card);border:1px solid var(--border);border-radius:12px;flex-wrap:wrap;gap:15px}
h1{color:var(--red);font-size:22px}
h1 i{margin-right:8px}
.btn{padding:10px 18px;border-radius:8px;border:0;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.2s;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn-primary{background:var(--red);color:#fff}
.btn-secondary{background:#333;color:#fff}
.btn-danger{background:#aa0000;color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:25px;margin-bottom:20px}
.card h2{color:var(--red);font-size:18px;margin-bottom:15px}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px;font-weight:600}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px;background:#222;border:1px solid #333;border-radius:6px;color:#fff;font-size:14px;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--red)}
.form-group textarea{min-height:100px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.checkbox{display:flex;align-items:center;gap:8px}
.checkbox input{width:auto}
.channel-item{background:#1a1a1a;border:1px solid var(--border);border-radius:8px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.channel-info{flex:1;min-width:200px}
.channel-name{font-weight:bold;color:var(--red);margin-bottom:4px}
.channel-meta{color:var(--muted);font-size:12px}
.channel-actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.empty{text-align:center;padding:40px;color:var(--muted)}
.msg{padding:12px 16px;border-radius:6px;margin-bottom:15px;font-size:14px;display:none}
.msg.show{display:block}
.msg.success{background:rgba(0,255,0,.1);border:1px solid #00aa00;color:#0a0}
.msg.error{background:rgba(255,0,0,.1);border:1px solid #aa0000;color:#f88}
@media(max-width:600px){.form-row{grid-template-columns:1fr}.channel-item{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><i class="fas fa-cog"></i> Admin - Dark Play</h1>
    <div>
      <a href="/" class="btn btn-secondary"><i class="fas fa-eye"></i> Ver Player</a>
      <button class="btn btn-danger" id="logoutBtn" style="display:none" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>
  </header>

  <div id="loginView" class="card">
    <h2><i class="fas fa-lock"></i> Login</h2>
    <div class="msg" id="loginMsg"></div>
    <div class="form-group">
      <label>Senha de Administrador</label>
      <input type="password" id="password" placeholder="Digite a senha" onkeypress="if(event.key==='Enter')login()">
    </div>
    <button class="btn btn-primary" onclick="login()"><i class="fas fa-sign-in-alt"></i> Entrar</button>
  </div>

  <div id="adminView" class="hidden">
    <div class="msg" id="msg"></div>

    <div class="card">
      <h2 id="formTitle"><i class="fas fa-plus"></i> Adicionar Canal</h2>
      <form id="channelForm" onsubmit="saveChannel(event)">
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label>Nome do Canal *</label>
            <input type="text" id="nome" required placeholder="Ex: ESPN">
          </div>
          <div class="form-group">
            <label>Categoria</label>
            <input type="text" id="categoria" placeholder="Ex: Esportes" value="Geral">
          </div>
        </div>
        <div class="form-group">
          <label>URL da Imagem (opcional)</label>
          <input type="text" id="imagem" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Código Embed (iframe) *</label>
          <textarea id="iframe" required placeholder='<iframe src="https://..." width="100%" height="100%" frameborder="0" allowfullscreen></iframe>'></textarea>
        </div>
        <div class="form-row">
          <div class="form-group checkbox">
            <input type="checkbox" id="parental">
            <label for="parental" style="margin:0">Conteúdo adulto (+18)</label>
          </div>
          <div class="form-group">
            <label>Senha Parental</label>
            <input type="text" id="parental_senha" placeholder="Ex: 1234">
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar Canal</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()">Limpar</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2><i class="fas fa-list"></i> Canais Cadastrados (<span id="total">0</span>)</h2>
      <div id="channelList"></div>
    </div>
  </div>
</div>

<script>
let channels = [];

async function checkAuth() {
  try {
    const res = await fetch('/api/auth', { cache: 'no-store' });
    const data = await res.json();
    if (data.authenticated) showAdmin(); else showLogin();
  } catch { showLogin(); }
}

function showLogin() {
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('adminView').classList.add('hidden');
  document.getElementById('logoutBtn').style.display = 'none';
}

function showAdmin() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('adminView').classList.remove('hidden');
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  loadChannels();
}

async function login() {
  const pwd = document.getElementById('password').value;
  if (!pwd) return;
  const msg = document.getElementById('loginMsg');
  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    const data = await res.json();
    if (res.ok) {
      msg.className = 'msg';
      document.getElementById('password').value = '';
      showAdmin();
    } else {
      msg.className = 'msg error show';
      msg.textContent = data.error || 'Senha incorreta.';
    }
  } catch (e) {
    msg.className = 'msg error show';
    msg.textContent = 'Erro: ' + e.message;
  }
}

async function logout() {
  await fetch('/api/auth', { method: 'DELETE' });
  location.reload();
}

async function loadChannels() {
  try {
    const res = await fetch('/api/canais', { cache: 'no-store' });
    const data = await res.json();
    channels = Array.isArray(data.canais) ? data.canais : [];
    renderList();
  } catch (e) {
    showMsg('Erro ao carregar: ' + e.message, 'error');
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderList() {
  document.getElementById('total').textContent = channels.length;
  const list = document.getElementById('channelList');
  if (!channels.length) {
    list.innerHTML = '<div class="empty">Nenhum canal cadastrado. Adicione o primeiro acima.</div>';
    return;
  }
  list.innerHTML = channels.map(c => `
    <div class="channel-item">
      <div class="channel-info">
        <div class="channel-name">${escapeHtml(c.nome)} ${c.parental ? '🔞' : ''}</div>
        <div class="channel-meta">${escapeHtml(c.categoria || 'Geral')} ${c.imagem ? '· com imagem' : ''} ${c.parental && c.parental_senha ? '· protegido' : ''}</div>
      </div>
      <div class="channel-actions">
        <button class="btn btn-secondary btn-sm" onclick="editChannel('${escapeHtml(c.id)}')"><i class="fas fa-edit"></i> Editar</button>
        <button class="btn btn-danger btn-sm" onclick="deleteChannel('${escapeHtml(c.id)}')"><i class="fas fa-trash"></i> Excluir</button>
      </div>
    </div>
  `).join('');
}

async function saveChannel(e) {
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const canal = {
    nome: document.getElementById('nome').value.trim(),
    categoria: document.getElementById('categoria').value.trim() || 'Geral',
    imagem: document.getElementById('imagem').value.trim(),
    iframe: document.getElementById('iframe').value.trim(),
    parental: document.getElementById('parental').checked,
    parental_senha: document.getElementById('parental_senha').value.trim()
  };
  if (!canal.nome || !canal.iframe) {
    showMsg('Nome e iframe são obrigatórios.', 'error');
    return;
  }
  try {
    const res = await fetch('/api/canais', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(id ? { action: 'update', id, canal } : { action: 'add', canal })
    });
    const data = await res.json();
    if (res.ok) {
      showMsg(id ? 'Canal atualizado!' : 'Canal adicionado!', 'success');
      resetForm();
      await loadChannels();
    } else {
      showMsg(data.error || 'Erro ao salvar.', 'error');
    }
  } catch (e) {
    showMsg('Erro: ' + e.message, 'error');
  }
}

function editChannel(id) {
  const c = channels.find(x => x.id === id);
  if (!c) return;
  document.getElementById('editId').value = id;
  document.getElementById('nome').value = c.nome || '';
  document.getElementById('categoria').value = c.categoria || 'Geral';
  document.getElementById('imagem').value = c.imagem || '';
  document.getElementById('iframe').value = c.iframe || '';
  document.getElementById('parental').checked = c.parental === true;
  document.getElementById('parental_senha').value = c.parental_senha || '';
  document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> Editar Canal';
  document.getElementById('channelForm').scrollIntoView({ behavior: 'smooth' });
}

async function deleteChannel(id) {
  if (!confirm('Excluir este canal?')) return;
  try {
    const res = await fetch('/api/canais', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', id })
    });
    const data = await res.json();
    if (res.ok) {
      showMsg('Canal excluído.', 'success');
      await loadChannels();
    } else {
      showMsg(data.error || 'Erro.', 'error');
    }
  } catch (e) {
    showMsg('Erro: ' + e.message, 'error');
  }
}

function resetForm() {
  document.getElementById('editId').value = '';
  document.getElementById('nome').value = '';
  document.getElementById('categoria').value = 'Geral';
  document.getElementById('imagem').value = '';
  document.getElementById('iframe').value = '';
  document.getElementById('parental').checked = false;
  document.getElementById('parental_senha').value = '';
  document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus"></i> Adicionar Canal';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.className = 'msg ' + type + ' show';
  el.textContent = text;
  setTimeout(() => el.classList.remove('show'), 4000);
}

checkAuth();
</script>
</body>
</html>
